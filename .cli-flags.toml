# Non-secret command-line configuration for fiducia-auth. Keys and signing
# material remain environment-only and are deliberately not accepted as flags.
[help]
url = "https://github.com/fiducia-cloud/fiducia-auth.rs"
columns = ["options", "env", "type", "description"]

[parse]
allow_unknown = false

[env]
ignore = ["FIDUCIA_INTERNAL_SECRET", "FIDUCIA_INTROSPECT_SECRET", "FIDUCIA_JWT_SIGNING_KEY", "FIDUCIA_KEY_IDEMPOTENCY_SECRET", "SUPABASE_SERVICE_ROLE_KEY"]

[flags.port]
env = "PORT"
aliases = ["port"]
short = "p"
type = "integer"
help = "HTTP listen port."

[flags.kv-url]
env = "FIDUCIA_KV_URL"
aliases = ["kv-url"]
type = "string"
help = "Durable Fiducia KV endpoint for API keys."

[flags.kv-org-id]
env = "FIDUCIA_KV_ORG_ID"
aliases = ["kv-org-id"]
type = "string"
help = "Dedicated Fiducia node tenant used for auth-owned KV records."

[flags.customer-origin]
env = "FIDUCIA_CUSTOMER_ORIGIN"
aliases = ["customer-origin"]
type = "string"
help = "Exact standalone customer-app HTTP(S) origin allowed by CORS."

[flags.rotation-overlap-seconds]
env = "FIDUCIA_ROTATION_OVERLAP_SECONDS"
aliases = ["rotation-overlap-seconds"]
type = "integer"
help = "Maximum positive-introspection cache overlap after rotation, in seconds."

[flags.jwt-issuer]
env = "FIDUCIA_JWT_ISSUER"
aliases = ["jwt-issuer"]
type = "string"
help = "JWT issuer claim."

[flags.jwt-audience]
env = "FIDUCIA_JWT_AUDIENCE"
aliases = ["jwt-audience"]
type = "string"
help = "JWT audience claim."

[flags.supabase-url]
env = "SUPABASE_URL"
aliases = ["supabase-url"]
type = "string"
help = "Optional Supabase project URL."

[flags.supabase-sync-interval-secs]
env = "SUPABASE_SYNC_INTERVAL_SECS"
aliases = ["supabase-sync-interval-secs"]
type = "integer"
help = "Supabase synchronization interval in seconds."

[flags.log]
env = "RUST_LOG"
aliases = ["log"]
type = "string"
help = "Rust tracing filter."
