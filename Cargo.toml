# Crate manifest: package metadata and dependencies for the fiducia-auth server.
[package]
name = "fiducia-auth"
version = "0.1.0"
edition = "2021"
description = "Auth server for fiducia.cloud — verifies Supabase dashboard sessions, issues/validates B2B API keys, and mints short-lived JWTs so the hot path never calls auth."

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["trace", "timeout", "limit", "catch-panic", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# API-key crypto. Lifecycle secrets are domain-separated HMAC outputs derived
# from a high-entropy deployment secret so exact idempotent retries can recover
# the same raw response; only SHA-256 hashes are stored. `getrandom` also backs
# ephemeral JWT identifiers. High-entropy secrets do not need a slow password
# KDF, and hashes are constant-time compared on introspect.
getrandom = "0.2"
sha2 = "0.10"
hmac = "0.12"

# Shared OpenTelemetry + tracing setup (one init() for all services).
fiducia-telemetry = { git = "https://github.com/fiducia-cloud/fiducia-telemetry.rs", tag = "v0.2.1" }

# Shared API payload/error contract. Auth produces `Introspection` (the key-
# validation result the edge/LB caches), so it speaks the shared type directly.
fiducia-interfaces = { path = "../fiducia-interfaces/generated/rust" }

# Supabase Auth verification. Supabase exposes asymmetric signing keys via JWKS;
# if a project still uses shared-secret JWT signing, we fall back to the Auth
# user endpoint with the publishable key.
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# fiducia-issued JWTs are signed with ES256 (ECDSA P-256). `p256` lets us load a
# PKCS#8 signing key (shared across replicas via a k8s secret) and derive the
# public JWK (x/y) we publish at /.well-known/jwks.json for offline verification.
p256 = { version = "0.13", features = ["pkcs8", "pem", "ecdsa"] }
base64 = "0.22"
once_cell = "1"
thiserror = "2"

# API keys are durably stored in fiducia KV; org/plan rows are populated from
# Supabase before startup completes, keeping the hot path on local cache reads.

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
