name: den493-fix

on:
  push:
    branches:
      - agent/den-493-webauthn-protected-state

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-493-webauthn-protected-state
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Apply focused compiler fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          webauthn = Path('src/governance_ceremony/webauthn.rs')
          text = webauthn.read_text()
          text = text.replace(
              'let mut builder = WebauthnBuilder::new(rp_id, &origin)?;',
              'let builder = WebauthnBuilder::new(rp_id, &origin)?;',
          )
          webauthn.write_text(text)

          routes = Path('src/governance_ceremony/routes.inc.rs')
          text = routes.read_text()
          needle = '''        CeremonyError::InvalidRequest(_) => {
              error_response(StatusCode::BAD_REQUEST, "invalid_request")
          }
          CeremonyError::Store(_) | CeremonyError::CasRetriesExhausted => {'''
          replacement = '''        CeremonyError::InvalidRequest(_) => {
              error_response(StatusCode::BAD_REQUEST, "invalid_request")
          }
          CeremonyError::Webauthn(_) => {
              error_response(StatusCode::BAD_REQUEST, "webauthn_verification_failed")
          }
          CeremonyError::ProtectedState(_) => error_response(
              StatusCode::SERVICE_UNAVAILABLE,
              "protected_ceremony_state_unavailable",
          ),
          CeremonyError::Store(_) | CeremonyError::CasRetriesExhausted => {'''
          if needle not in text:
              raise SystemExit('expected route error-match block not found')
          routes.write_text(text.replace(needle, replacement))
          PY
          cargo fmt --all
      - name: Publish focused fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/governance_ceremony/webauthn.rs src/governance_ceremony/routes.inc.rs
          git commit -m "fix: map protected-state and WebAuthn failures"
          git push origin HEAD:agent/den-493-webauthn-protected-state
