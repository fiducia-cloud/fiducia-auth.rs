# Build and push both least-privilege service images on push to main.
name: docker
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # Required only to publish commit-SHA images to GHCR.
      issues: write # Required only to append validated image digests to issue 38.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: auth
            image: fiducia-auth
          - target: revocation-admin
            image: fiducia-revocation-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            INTERFACES_SHA=bd718cd72d72aa330534f3688f8fb1ce90c19d10
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
          tags: |
            ghcr.io/fiducia-cloud/${{ matrix.image }}:${{ github.sha }}
      - name: Validate and record immutable digest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LEDGER_ISSUE: "38"
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
          IMAGE: ghcr.io/fiducia-cloud/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ledger_entry="${RUNNER_TEMP}/fiducia-oci-release.md"
          bash scripts/render-oci-release-ledger-entry.sh \
            "$SOURCE_REPOSITORY" \
            "$SOURCE_SHA" \
            "$TARGET" \
            "$IMAGE" \
            "$DIGEST" >"$ledger_entry"
          gh issue comment "$RELEASE_LEDGER_ISSUE" \
            --repo "$SOURCE_REPOSITORY" \
            --body-file "$ledger_entry"
