name: den799-rustfmt

on:
  push:
    branches:
      - agent/den-493-durable-state-routes

permissions:
  contents: write

concurrency:
  group: den799-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-493-durable-state-routes
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Format and publish only rustfmt changes
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply rustfmt to DEN-799 bundle"
          git push origin HEAD:agent/den-493-durable-state-routes
