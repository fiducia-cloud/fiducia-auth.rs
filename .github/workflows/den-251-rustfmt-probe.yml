name: DEN-251 rustfmt probe

on:
  pull_request:
    paths:
      - src/bin/fiducia-auth-production-entrypoint.rs
      - .github/workflows/den-251-rustfmt-probe.yml
  push:
    branches:
      - agent/den-251-production-auth-entrypoint
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-251-rustfmt-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
      - name: Emit exact rustfmt output
        run: |
          set -euo pipefail
          cargo fmt --all
          printf 'RUSTFMT_BASE64='
          gzip -c src/bin/fiducia-auth-production-entrypoint.rs | base64 -w0
          printf '\n'
