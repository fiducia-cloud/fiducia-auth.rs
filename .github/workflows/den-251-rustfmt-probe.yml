name: DEN-251 rustfmt probe

on:
  pull_request:
    paths:
      - src/bin/fiducia-auth-production-entrypoint.rs
      - .github/workflows/den-251-rustfmt-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-251-rustfmt-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
      - name: Format probe file
        run: cargo fmt --all
      - name: Upload exact rustfmt output
        uses: actions/upload-artifact@v4
        with:
          name: den-251-rustfmt-output
          path: src/bin/fiducia-auth-production-entrypoint.rs
          if-no-files-found: error
          retention-days: 1
