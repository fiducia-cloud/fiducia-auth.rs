name: format DEN-252 once

on:
  push:
    branches:
      - agent/den-252-revocation-ledger

permissions:
  contents: write

concurrency:
  group: den-252-format-once
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-252-revocation-ledger
          fetch-depth: 0
          submodules: recursive
      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Format only the DEN-252 source surface and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(src/revocation.rs|src/revocation/tests.rs)$' || true)"
          if test -n "$unexpected"; then
            echo "rustfmt changed files outside the reviewed DEN-252 surface:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git rm .github/workflows/den-252-format-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/revocation.rs src/revocation/tests.rs
          git commit -m "style: apply pinned rustfmt to DEN-252 revocation code"
          git push origin HEAD:agent/den-252-revocation-ledger
