name: Finite-state safety model
on:
  pull_request:
    paths: ['formal/**', '.github/workflows/formal-safety.yml']
  push:
    branches: [main]
    paths: ['formal/**', '.github/workflows/formal-safety.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exhaustively explore bounded safety model
        run: node formal/check_safety.mjs
      - name: Reject adversarial safety-model mutations
        run: node --test formal/adversarial_contract.test.mjs
