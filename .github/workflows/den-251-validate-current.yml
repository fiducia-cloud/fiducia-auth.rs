name: DEN-251 validate corrected core verifier

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/den-251-validate-current.yml

permissions:
  contents: write

concurrency:
  group: den-251-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-and-clean:
    if: >-
      github.repository == 'fiducia-cloud/fiducia-auth.rs' &&
      github.head_ref == 'agent/den-251-core-jwks-observability-v2' &&
      github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive
          path: repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          persist-credentials: false
          path: fiducia-interfaces
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Run the complete Rust gate
        working-directory: repo
        shell: bash
        run: |
          set +e
          : > /tmp/den-251-validation.log
          {
            echo '$ cargo fmt --all'
            cargo fmt --all
            fmt_status=$?
            echo '$ cargo check --all-targets'
            cargo check --all-targets
            check_status=$?
            echo '$ cargo fmt --all -- --check'
            cargo fmt --all -- --check
            fmt_check_status=$?
            echo '$ cargo clippy --locked --all-targets -- -D warnings'
            cargo clippy --locked --all-targets -- -D warnings
            clippy_status=$?
            echo '$ cargo test --locked --all-targets'
            cargo test --locked --all-targets
            test_status=$?
            echo "fmt_status=${fmt_status}"
            echo "check_status=${check_status}"
            echo "fmt_check_status=${fmt_check_status}"
            echo "clippy_status=${clippy_status}"
            echo "test_status=${test_status}"
          } > /tmp/den-251-validation.log 2>&1

          if [[ ${fmt_status} -ne 0 || ${check_status} -ne 0 || ${fmt_check_status} -ne 0 || ${clippy_status} -ne 0 || ${test_status} -ne 0 ]]; then
            {
              echo '# DEN-251 corrected-branch validation diagnostic'
              echo
              rustc --version
              cargo --version
              echo
              cat /tmp/den-251-validation.log
            } > DEN251_DIAGNOSTIC.txt
            git add -A
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'DEN-251 capture corrected-branch diagnostic'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
            exit 1
          fi

      - name: Remove all temporary landing state
        working-directory: repo
        run: |
          rm .github/workflows/den-251-land-core.yml
          rm .github/workflows/den-251-diagnose-and-land.yml
          rm .github/workflows/den-251-validate-current.yml
          rm -f DEN251_DIAGNOSTIC.txt
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!vendor'; then
            echo 'git conflict marker found' >&2
            exit 1
          fi
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-251 finalize validated core verifier hardening'

          cat > /tmp/expected-net-files <<'EOF'
          Cargo.lock
          Cargo.toml
          README.md
          src/bin/fiducia-auth-production-entrypoint.rs
          src/main.rs
          src/supabase.rs
          src/supabase_policy.rs
          EOF
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-net-files
          sort -o /tmp/expected-net-files /tmp/expected-net-files
          diff -u /tmp/expected-net-files /tmp/actual-net-files
          git push origin "HEAD:${GITHUB_HEAD_REF}"
