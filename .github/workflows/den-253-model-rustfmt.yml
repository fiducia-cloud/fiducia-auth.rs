name: DEN-253 one-shot model rustfmt

on:
  push:
    branches:
      - agent/den-253-trusted-authorization-context
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-253-model-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: agent/den-253-trusted-authorization-context
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Format only the DEN-253 auth model
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 src/model.rs
          if git diff --quiet -- src/model.rs; then
            echo 'src/model.rs already matches rustfmt'
            exit 0
          fi
          if ! git diff --quiet -- . ':(exclude)src/model.rs'; then
            echo 'rustfmt changed an unexpected path' >&2
            git --no-pager diff -- . ':(exclude)src/model.rs'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/model.rs
          git commit -m 'DEN-253 apply rustfmt to authorization context'
          git push origin HEAD:agent/den-253-trusted-authorization-context
