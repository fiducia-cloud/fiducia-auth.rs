name: DEN-251 core policy transform

on:
  pull_request:
    paths:
      - '.github/workflows/den-251-core-transform.yml'
  push:
    branches:
      - agent/den-251-core-jwks-metrics
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-251-core-transform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout auth repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo

      - name: Checkout pinned interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Apply deterministic source transformation
        working-directory: repo
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          cargo_path = Path('Cargo.toml')
          cargo = cargo_path.read_text()
          cargo = replace_once(
              cargo,
              'tracing = "0.1"\ntracing-subscriber',
              'tracing = "0.1"\nopentelemetry = "0.32"\ntracing-subscriber',
              'Cargo.toml OpenTelemetry dependency',
          )
          cargo_path.write_text(cargo)

          path = Path('src/supabase.rs')
          source = path.read_text()
          source = replace_once(
              source,
              '''//! project's cached JWKS. If the project still uses shared-secret signing and
//! has no public JWKS, we fall back to Supabase's `/auth/v1/user` endpoint with
//! the publishable key.
''',
