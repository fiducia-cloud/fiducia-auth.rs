      - name: Format and validate transformed source
        working-directory: repo
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --binary --no-ext-diff > "${RUNNER_TEMP}/den-251.first.patch"
          cargo fmt --all
          git diff --binary --no-ext-diff > "${RUNNER_TEMP}/den-251.second.patch"
          cmp "${RUNNER_TEMP}/den-251.first.patch" "${RUNNER_TEMP}/den-251.second.patch"
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Collect transformed files
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/den-251-core"
          mkdir -p "$out/src"
          cp repo/Cargo.toml "$out/Cargo.toml"
          cp repo/README.md "$out/README.md"
          cp repo/src/supabase.rs "$out/src/supabase.rs"
          cp "${RUNNER_TEMP}/den-251.first.patch" "$out/generated.patch"

      - name: Upload validated transformation
        uses: actions/upload-artifact@v6
        with:
          name: den-251-core-jwks-metrics
          path: ${{ runner.temp }}/den-251-core
          if-no-files-found: error
          retention-days: 2
