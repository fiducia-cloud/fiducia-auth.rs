static FORCED_REFRESH_EVENTS: OnceLock<Counter<u64>> = OnceLock::new();
static REMOTE_USERINFO_EVENTS: OnceLock<Counter<u64>> = OnceLock::new();

fn auth_counter(
    cell: &'static OnceLock<Counter<u64>>,
    name: &'static str,
    description: &'static str,
) -> &'static Counter<u64> {
    cell.get_or_init(|| {
        global::meter("fiducia-auth")
            .u64_counter(name)
            .with_description(description)
            .with_unit("{event}")
            .build()
    })
}

fn record_unknown_kid(stage: &'static str) {
    auth_counter(
        &UNKNOWN_KID_EVENTS,
        "fiducia.auth.supabase.unknown_kid",
        "Unknown Supabase JWKS key-id events without recording the key id",
    )
    .add(1, &[KeyValue::new("stage", stage)]);
}

fn record_forced_refresh(outcome: &'static str) {
    auth_counter(
        &FORCED_REFRESH_EVENTS,
        "fiducia.auth.supabase.forced_jwks_refresh",
        "Forced Supabase JWKS refresh attempts and outcomes",
    )
    .add(1, &[KeyValue::new("outcome", outcome)]);
}

fn record_remote_userinfo(outcome: &'static str) {
    auth_counter(
        &REMOTE_USERINFO_EVENTS,
        "fiducia.auth.supabase.remote_userinfo",
        "Explicit non-production Supabase remote-userinfo fallback events",
    )
    .add(1, &[KeyValue::new("outcome", outcome)]);
}
