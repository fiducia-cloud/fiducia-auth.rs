''',
              '''#[derive(Clone, Copy, Debug, Eq, PartialEq)]
enum DeploymentMode {
    Production,
    Staging,
    Development,
    Test,
}

impl DeploymentMode {
    fn parse(value: Option<&str>) -> Result<Self, VerifyError> {
        match value
            .unwrap_or("production")
            .trim()
            .to_ascii_lowercase()
            .as_str()
        {
            "production" | "prod" => Ok(Self::Production),
            "staging" | "stage" => Ok(Self::Staging),
            "development" | "dev" => Ok(Self::Development),
            "test" => Ok(Self::Test),
            other => Err(VerifyError::InvalidDeploymentMode(other.to_string())),
        }
    }
}

fn parse_optional_bool(
    name: &'static str,
    value: Option<&str>,
) -> Result<Option<bool>, VerifyError> {
    let Some(value) = value else {
        return Ok(None);
    };
    match value.trim().to_ascii_lowercase().as_str() {
        "1" | "true" | "yes" | "on" => Ok(Some(true)),
        "0" | "false" | "no" | "off" => Ok(Some(false)),
        other => Err(VerifyError::InvalidBoolean {
            name,
            value: other.to_string(),
        }),
    }
}

fn resolve_remote_userinfo_policy(
    mode: DeploymentMode,
    requested: Option<bool>,
    has_publishable_key: bool,
) -> Result<bool, VerifyError> {
    let enabled = requested.unwrap_or(false);
    if mode == DeploymentMode::Production && enabled {
        return Err(VerifyError::RemoteUserinfoForbiddenInProduction);
    }
    if enabled && !has_publishable_key {
        return Err(VerifyError::MissingPublishableKey);
    }
    Ok(enabled)
}
