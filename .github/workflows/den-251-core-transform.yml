//! default and forbidden in production; it exists only as an explicit,
//! observable non-production migration path for shared-secret projects.
''',
              'module documentation',
          )
          source = replace_once(
              source,
              '''use std::{
    env, fmt,
    time::{Duration, Instant},
};
''',
              '''use std::{
    env, fmt,
    sync::OnceLock,
    time::{Duration, Instant},
};
''',
              'std imports',
          )
          source = replace_once(
              source,
              '''use reqwest::StatusCode;
''',
              '''use opentelemetry::{global, metrics::Counter, KeyValue};
use reqwest::StatusCode;
''',
              'OpenTelemetry import',
          )
          source = replace_once(
              source,
              '''const DEFAULT_HTTP_TIMEOUT_SECS: u64 = 5;
''',
              '''const DEFAULT_HTTP_TIMEOUT_SECS: u64 = 5;
const DEPLOYMENT_MODE_ENV: &str = "FIDUCIA_DEPLOYMENT_MODE";
const REMOTE_USERINFO_ENV: &str = "SUPABASE_AUTH_ALLOW_REMOTE_USERINFO";
const PUBLISHABLE_KEY_ENV: &str = "SUPABASE_PUBLISHABLE_KEY";
''',
              'policy constants',
          )
          source = replace_once(
              source,
