name: den493-indent

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-493-webauthn-protected-state
          fetch-depth: 0
      - name: Normalize included route formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/governance_ceremony/routes.inc.rs')
          text = path.read_text()
          old = '''        CeremonyError::Webauthn(_) => {
              error_response(StatusCode::BAD_REQUEST, "webauthn_verification_failed")
          }
          CeremonyError::ProtectedState(_) => error_response(
              StatusCode::SERVICE_UNAVAILABLE,
              "protected_ceremony_state_unavailable",
          ),'''
          # `include!` fragments are not rewritten by `cargo fmt`, so normalize
          # the exact block explicitly and fail if the expected code moved.
          compact = '''        CeremonyError::Webauthn(_) => {
              error_response(StatusCode::BAD_REQUEST, "webauthn_verification_failed")
          }
          CeremonyError::ProtectedState(_) => error_response(
              StatusCode::SERVICE_UNAVAILABLE,
              "protected_ceremony_state_unavailable",
          ),'''
          if old in text:
              path.write_text(text.replace(old, compact, 1))
              raise SystemExit(0)

          ugly = '''        CeremonyError::Webauthn(_) => {
              error_response(StatusCode::BAD_REQUEST, "webauthn_verification_failed")
          }
          CeremonyError::ProtectedState(_) => error_response(
              StatusCode::SERVICE_UNAVAILABLE,
              "protected_ceremony_state_unavailable",
          ),'''
          if ugly not in text:
              # Match the unindented generated block literally.
              ugly = '''        CeremonyError::Webauthn(_) => {
    error_response(StatusCode::BAD_REQUEST, "webauthn_verification_failed")
}
CeremonyError::ProtectedState(_) => error_response(
    StatusCode::SERVICE_UNAVAILABLE,
    "protected_ceremony_state_unavailable",
),'''
          if ugly not in text:
              raise SystemExit('expected WebAuthn error block not found')
          path.write_text(text.replace(ugly, compact, 1))
          PY
      - name: Publish formatting-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/governance_ceremony/routes.inc.rs
          if git diff --cached --quiet; then
            echo "route block already normalized"
            exit 0
          fi
          git commit -m "style: normalize governance ceremony error mapping"
          git push origin HEAD:agent/den-493-webauthn-protected-state
