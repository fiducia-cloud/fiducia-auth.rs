name: secrets-audit

# Fail-closed check that no plaintext secret can reach this repository.
#
# Runs with NO age key on purpose. Everything it asserts is key-independent:
# that no plaintext env file is tracked or staged, that .gitignore still denies
# them, that nothing was force-added past those rules, and that every file in
# env/enc/ is genuinely sops-encrypted with at least two recipients. Handing CI
# a decryption key merely to lint would defeat the audit it is performing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          # env-check inspects tracked history, not just the worktree.
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified just
        env:
          JUST_VERSION: 1.51.0
          JUST_SHA256: c8f085ca3e885723c341d06243fc291b5abfdc8bbe3b2c076b117de490387b59
        run: |
          set -euo pipefail
          asset="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/${asset}"
          printf '%s  %s\n' "$JUST_SHA256" /tmp/just.tar.gz | sha256sum --check --strict -
          tar --extract --gzip --file /tmp/just.tar.gz --directory /tmp \
            --no-same-owner --no-same-permissions just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          test "$(just --version)" = "just ${JUST_VERSION}"

      - name: just env-check
        run: just env-check
