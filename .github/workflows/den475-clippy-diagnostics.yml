name: den475-clippy-diagnostics

on:
  push:
    branches:
      - agent/den-475-durable-webauthn-ceremonies

permissions:
  contents: write

concurrency:
  group: den475-clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-475-durable-webauthn-ceremonies
          path: repo
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: clippy
      - name: Capture compiler and Clippy diagnostics
        working-directory: repo
        run: |
          set +e
          cargo clippy --locked --all-targets -- -D warnings > docs/den475-clippy.log 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> docs/den475-clippy.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/den475-clippy.log
          git commit -m "ci: capture DEN-475 clippy diagnostics"
          git push origin HEAD:agent/den-475-durable-webauthn-ceremonies
