name: den475-clippy-diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: den475-clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: clippy
      - name: Capture compiler and Clippy diagnostics
        working-directory: repo
        run: |
          set +e
          cargo clippy --locked --all-targets -- -D warnings > den475-clippy.log 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> den475-clippy.log
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den475-clippy-diagnostics
          path: repo/den475-clippy.log
          retention-days: 1
          if-no-files-found: error
