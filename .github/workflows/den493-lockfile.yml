name: den493-lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: den493-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-493-webauthn-protected-state
          fetch-depth: 0
          path: repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: bd718cd72d72aa330534f3688f8fb1ce90c19d10
          path: fiducia-interfaces
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - name: Restore main lockfile and resolve only required additions
        working-directory: repo
        run: |
          git show origin/main:Cargo.lock > Cargo.lock
          cargo check --all-targets
      - name: Publish minimal lockfile
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "lockfile already minimal"
            exit 0
          fi
          git commit -m "build: minimize DEN-493 lockfile update"
          git push origin HEAD:agent/den-493-webauthn-protected-state
