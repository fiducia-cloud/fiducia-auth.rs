name: Formal wave 2
on:
  pull_request:
    paths: ['conformance/**', '.github/workflows/formal-wave2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python conformance/independent_proof_model.py
