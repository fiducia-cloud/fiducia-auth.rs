name: Formal wave 2
on:
  pull_request:
    paths: ['conformance/**', '.github/workflows/formal-wave2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-model-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
      - name: Compile bounded independent-proof model
        run: rustc --edition=2024 -D warnings conformance/independent_proof_model.rs -o "$RUNNER_TEMP/independent-proof-model"
      - name: Execute bounded independent-proof model
        run: "$RUNNER_TEMP/independent-proof-model"
