name: den493-bootstrap

on:
  push:
    branches:
      - agent/den-493-webauthn-protected-state

permissions:
  contents: write

concurrency:
  group: den493-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-493-webauthn-protected-state
          path: repo
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: bd718cd72d72aa330534f3688f8fb1ce90c19d10
          path: fiducia-interfaces
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: repo
      - name: Repair identifier, update lockfile, format, and validate
        working-directory: repo
        run: |
          sed -i 's/fn safe_api_registration_state_is_serialized_only inside_server_envelope()/fn safe_api_registration_state_is_serialized_only_inside_server_envelope()/' src/governance_ceremony/webauthn.rs
          cargo check --all-targets
          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Publish generated lockfile and rustfmt-only changes
        working-directory: repo
        run: |
          if git diff --quiet; then
            echo "no generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock Cargo.toml src/governance_ceremony.rs src/governance_ceremony/webauthn.rs src/governance_ceremony/config.inc.rs
          git commit -m "build: lock and format DEN-493 WebAuthn protected state"
          git push origin HEAD:agent/den-493-webauthn-protected-state
